name: Release Please

# Disabled auto-run on this stepsale fork: full upstream history makes
# release-please fail (invalid previous_tag / unparsable commits).
# Re-enable on: push to main when you want automated releases here.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
